name: Steps Practice

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: System Information
        run : |
             echo "User Information"
             uname -a
             echo "Current Directory"
             pwd
             echo "List files"
             ls
      
      - name : Version Check
        run : |
             git --version
             docker --version
             python --version

