name: Environment Practice

on:
  push:

env:
  APP_NAME: my-app

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: development

    steps:
      - name: Show variables
        env:
          VERSION: "1.0"
        run: |
          echo "App Name: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Version: $VERSION"