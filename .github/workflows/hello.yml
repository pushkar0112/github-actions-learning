name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-python-app:latest .

      - name: Check Docker image
        run: docker images

      - name: Run Docker container
        run: docker run --rm my-python-app:latest