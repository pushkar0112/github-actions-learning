name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: |
          echo "Selected environment: ${{ inputs.environment }}"

      - name: Deploy
        run: |
          echo "Deploying to ${{ inputs.environment }}"